name: Java CI with Maven

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ "main", "master","test" ]
  pull_request:
    branches: [ "main", "master", "test" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository source code onto the GitHub runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up Java 21 environment using the Temurin distribution
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven' # Automatically caches Maven dependencies for faster subsequent builds

    # Step 3: Build the executable JAR file using Maven
    - name: Build with Maven
      run: mvn clean package

    # Step 4: Upload the compiled JAR file so you can download it from GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Executable-Jar
        path: target/*.jar
        if-no-files-found: error

