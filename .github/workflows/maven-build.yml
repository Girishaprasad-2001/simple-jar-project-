name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test-java:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.set-output.outputs.jar_name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Package with Maven
      run: mvn clean package

    - name: Upload Built JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Executable-Jar
        path: target/*.jar

  build-and-test-docker:
    needs: build-and-test-java
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Download the JAR file compiled in the previous job step
    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: Executable-Jar
        path: target/

    # Set up modern Buildx capabilities for caching and multi-platform compilation
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # 1. Local Image Build for sanity testing
    - name: Build Docker Image Locally
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true # Exports the image directly into the runner's local Docker engine
        tags: local-test-app:latest

    # 2. Integration Container Testing
    - name: Run Container Integration Test
      run: |
        echo "Launching test container instance..."
        docker run -d -p 8080:8080 --name test-container local-test-app:latest
        
        echo "Waiting for web server initialization..."
        sleep 5
        
        echo "Testing network response endpoint (Port 8080)..."
        # Checks if port 8080 responds with HTTP 200 code
        curl --silent --fail http://localhost:8080/?name=GitHubCI || exit 1
        
        echo "Clean validation test passed! Tearing down instance..."
        docker stop test-container
        docker rm test-container

    # 3. Secure Login to Docker Hub
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }} # Updated here to use your password secret

    # 4. Final Push to Production Registry
    - name: Build and Push to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/simple-web-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/simple-web-app:${{ github.sha }}

